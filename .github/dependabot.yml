# Keeps the SHA-pinned GitHub Actions up to date (one grouped pull request a
# week). The tests run on every Dependabot pull request like on any other.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  # hash-pinned test helpers (tests/requirements.txt); hashes are regenerated
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: monthly
    groups:
      test-helpers:
        patterns: ["*"]
    commit-message:
      prefix: test
