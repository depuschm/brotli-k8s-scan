name: codeql

# Static analysis (SAST) of the GitHub Actions workflows, the Python helpers
# (tests, image pipeline) and the JavaScript image renderer. The scanner itself
# is bash, which CodeQL does not analyse; ShellCheck covers it in test.yml.
# Findings appear in the Security tab (code scanning).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "29 3 * * 3"

permissions:
  contents: read

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write  # upload results to code scanning
      actions: read           # needed by CodeQL to read workflow run info
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
