# Namespace-scoped permissions for brotli-k8s-scan.sh -n <namespace>.
# Use this instead of the ClusterRole when you only want to scan one namespace.
# For `--no-exec` you can delete the pods/exec rule.
# pods/exec is powerful: bind it only for the duration of the scan.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: brotli-scanner
  namespace: my-namespace
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: brotli-scanner
  namespace: my-namespace
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: brotli-scanner
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: security-scanner@example.com
